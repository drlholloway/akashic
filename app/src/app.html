<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#1c1f22" />
		<link rel="preload" href="%sveltekit.assets%/fonts/BarlowCondensed-600.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/Barlow-400.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!--
		DIRECTION: Faceplate & drill template.
		WORLD: the finished pedal enclosure face (powder coat, screen-printed condensed caps,
		  knob/LED/footswitch positions) and the drill template that made it (hairline rules,
		  crosshair centers, mono dimensions on drafting white).
		FIRST VIEWPORT: the search field as the template title block, then the circuit index as
		  a dimensioned table; every row carries a faceplate glyph generated from its real controls.
		VISITOR PATH: type -> narrow by facets (vendor, category, enclosure, knobs, original, part)
		  -> circuit page whose header IS the faceplate -> BOM as a parts-list drawing -> buy / doc.
		SIGNATURE: the data-driven faceplate glyph; the same enclosure grammar at 24px and 240px.
		REACH: parts cross-reference and originals index reuse the table + title-block grammar.
		RISK: glyphs must read as information, not ornament; kept small, monochrome, and exact.
		-->
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
