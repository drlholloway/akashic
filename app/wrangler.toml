# Cloudflare Workers static-assets deploy (Pages is now part of Workers).
# `npm run deploy` exports the data, builds, and runs `wrangler deploy`.
name = "pcb-schematic-library"
compatibility_date = "2026-09-01"

[assets]
directory = "./build"
# Unknown routes get 404.html, the app shell, which client-side routes them (or shows the error).
not_found_handling = "404-page"
