# Cloudflare Workers static-assets deploy (Pages is now part of Workers).
# `npm run deploy` exports the data, builds, and runs `wrangler deploy`.
name = "akashic"
compatibility_date = "2026-09-01"
workers_dev = false

# Custom domain on the Cryptid Effects zone (Cloudflare creates the DNS record and certificate).
routes = [
  { pattern = "akashic.cryptideffects.com", custom_domain = true }
]

[assets]
directory = "./build"
# Unknown routes get 404.html, the app shell, which client-side routes them (or shows the error).
not_found_handling = "404-page"
