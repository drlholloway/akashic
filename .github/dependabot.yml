# Dependabot version updates. Security alerts and fixes are enabled in the
# repository settings; this schedules routine bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      app:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /scraper
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
