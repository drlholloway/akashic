# Dependabot version updates. Security alerts and fixes are enabled in the
# repository settings; this schedules routine bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      app:
        patterns: ["*"]
    ignore:
      # SvelteKit pins the TypeScript major it supports; bump it by hand with the kit.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /scraper
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
