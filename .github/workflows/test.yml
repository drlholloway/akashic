name: test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  scraper:
    name: Scraper (import, normalization, empty export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: cd scraper && uv sync --frozen
      - name: adapters register and parsers import
        run: cd scraper && .venv/bin/pcblib vendors
      - name: value normalization smoke test
        run: |
          cd scraper && .venv/bin/python - <<'PY'
          from pcblib.normalize import normalize_row
          from pcblib.models import BomRow
          cases = {("R1", "1K5"): "1.5k", ("R2", "1m"): "1M", ("C1", "4u7"): "4.7u", ("C2", "100nF"): "100n",
                   ("VOL", "A100K"): "A100k", ("TONE", "100KB"): "B100k", ("IC1", "TL072"): "TL072",
                   ("D1", "9.1V Zener"): "9V1", ("D2", "9v1"): "9V1", ("D3", "ZENER12V"): "12V", ("D4", "1N4148"): "1N4148",
                   ("C3", ".01uF"): "10n", ("C4", ".47u"): "470n", ("C5", "104"): "100n", ("C6", "470"): "470"}
          for (ref, val), want in cases.items():
              got = normalize_row(BomRow(ref=ref, value=val)).norm_value
              assert got == want, (ref, val, got, want)
          from pcblib.normalize import catalog_keys
          assert catalog_keys("D", "1N4739A") == ["1N4739A", "9V1"] and catalog_keys("D", "1N5817") == ["1N5817"]
          from pcblib.originals import original
          for raw, want in {"EHX Big Muff": "Electro-Harmonix Big Muff Pi", "Big Muff Pi": "Electro-Harmonix Big Muff Pi",
                            "EHX Op-Amp Big Muff": "Electro-Harmonix Op-Amp Big Muff Pi", "Pro Co RAT": "ProCo RAT",
                            "Ibanez TS-808": "Ibanez TS808 Tube Screamer", "Fuzz Face into Big Muff": "Fuzz Face into Big Muff",
                            "Lots of Big Muff Pi variants": ""}.items():
              assert original(raw) == want, (raw, original(raw), want)
          from pcblib.normalize import ic_name
          for raw, want in {"072": "TL072", "TL072CP": "TL072", "JRC4558D": "4558", "LM3080": "CA3080", "LM308N": "LM308",
                            "7660S": "7660S", "ICL7660": "7660", "TLC555": "TLC555", "LM4040": "LM4040", "4049": "CD4049UB"}.items():
              assert ic_name(raw) == want, (raw, ic_name(raw), want)
          print("ok")
          PY
      - name: export an empty library
        run: cd scraper && .venv/bin/pcblib export

  app:
    name: App (check and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - run: cd scraper && uv sync --frozen && .venv/bin/pcblib export
      - run: cd app && npm ci
      - run: cd app && npm run check
      - run: cd app && npm run build
