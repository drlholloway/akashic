name: Feature request
description: Suggest a filter, a view, a data field or a workflow improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you are doing at the bench or desk when you would use this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
